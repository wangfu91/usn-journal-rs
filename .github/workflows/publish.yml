name: Publish to crates.io

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: github.event.created && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate release tag and lockfile
        shell: pwsh
        run: ./.github/scripts/Validate-ReleaseTag.ps1 -TagName $env:GITHUB_REF_NAME -EventPath $env:GITHUB_EVENT_PATH
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build all targets
        run: cargo build --locked --all-targets --all-features
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-features
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Verify publication without uploading
        run: cargo publish --locked --registry crates-io --dry-run
      - name: Publish to crates.io
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CARGO_REGISTRY_TOKEN)) {
            throw 'CARGO_REGISTRY_TOKEN must be configured as an Actions secret.'
          }
          cargo publish --locked --registry crates-io
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
